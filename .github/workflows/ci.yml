name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: gofmt -l cmd internal scripts | tee /tmp/gofmt.txt && test ! -s /tmp/gofmt.txt

  linux-amd64:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          tag_version="${RELEASE_VERSION#v}"
          source_version="$(sed -n 's/^var pluginVersion = "\([^\"]*\)"$/\1/p' cmd/plugin/main.go)"
          test -n "$source_version"
          test "$tag_version" = "$source_version"
      - name: Build and verify Linux/amd64 plugin
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          version="${RELEASE_VERSION#v}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$version" ./scripts/build-linux-amd64.sh
          else
            ./scripts/build-linux-amd64.sh
          fi
      - name: Package release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          version="${RELEASE_VERSION#v}"
          so="dist/cpa-plugin-codex-turn-state-v${version}.so"
          package_dir="release/codex-turn-state-cache"
          mkdir -p "$package_dir"
          cp "$so" "$package_dir/codex-turn-state-cache.so"
          (cd "$package_dir" && zip -q -j "../cpa-plugin-codex-turn-state_${version}_linux_amd64.zip" codex-turn-state-cache.so)
          (cd release && sha256sum "cpa-plugin-codex-turn-state_${version}_linux_amd64.zip" > checksums.txt)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpa-plugin-codex-turn-state-linux-amd64-${{ github.sha }}
          path: |
            dist/cpa-plugin-codex-turn-state-v*.so
            dist/cpa-plugin-codex-turn-state-v*.so.sha256
            release/cpa-plugin-codex-turn-state_*_linux_amd64.zip
            release/checksums.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: linux-amd64
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cpa-plugin-codex-turn-state-linux-amd64-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release-assets/cpa-plugin-codex-turn-state_*.zip \
            release-assets/checksums.txt
